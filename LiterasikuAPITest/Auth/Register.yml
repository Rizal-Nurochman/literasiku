info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "full_name": "{{full_name}}",
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: username
      value: taqin_op
    - name: full_name
      value: Taqin OP
    - name: email
      value: taqin.op@literasiku.test
    - name: password
      value: rahasia123

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
