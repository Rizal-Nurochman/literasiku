info:
  name: Create Category
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/categories"
  body:
    type: json
    data: |-
      {
        "name": "{{category_name}}"
      }
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlIjoiQURNSU4iLCJpc3MiOiJsaXRlcmFzaWt1IiwiaWF0IjoxNzgyMDM4OTQwfQ.KbCj6mAk1dzKXaLB1odEnPhHbUxm-M9Ybr0ybec7rNI
    - name: category_name
      value: Fiksi

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

vars:
  postResponse:
    - name: category_id
      value: res.body.data.id

assertions:
  - res.status: eq 201
  - res.body.status: eq true
  - res.body.message: contains "Category created successfully"
  - res.body.data.id: isNumber
  - res.body.data.name: eq "{{category_name}}"