info:
  name: Filter Books By Category
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}/books"
  query:
    - name: page
      value: "1"
      disabled: false
    - name: limit
      value: "10"
      disabled: false
    - name: search
      value: ""
      disabled: true
    - name: category_id
      value: "{{category_id}}"
      disabled: false
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: category_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Books retrieved successfully"
  - res.body.data.data: isArray