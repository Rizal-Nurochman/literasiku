info:
  name: Get Book By ID
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/books/{{book_id}}"
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: book_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Book retrieved successfully"
  - res.body.data.id: eq {{book_id}}
  - res.body.data.category: isObject
  - res.body.data.files: isArray