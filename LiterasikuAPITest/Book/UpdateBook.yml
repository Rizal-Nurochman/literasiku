info:
  name: Update Book
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{base_url}}/books/{{book_id}}"
  body:
    type: json
    data: |-
      {
        "title": "Laskar Pelangi (Edisi Revisi)",
        "author": "Andrea Hirata",
        "publisher": "Bentang Pustaka",
        "year_published": 2005,
        "isbn": "9789793062792",
        "category_id": {{category_id}},
        "physical_stock": 15,
        "is_physical_available": true,
        "is_digital_available": true,
        "status": "ACTIVE"
      }
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlIjoiQURNSU4iLCJpc3MiOiJsaXRlcmFzaWt1IiwiaWF0IjoxNzgyMDM4OTQwfQ.KbCj6mAk1dzKXaLB1odEnPhHbUxm-M9Ybr0ybec7rNI
    - name: book_id
      value: 1
    - name: category_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Book updated successfully"
  - res.body.data.id: eq {{book_id}}
  - res.body.data.title: eq "Laskar Pelangi (Edisi Revisi)"
  - res.body.data.physical_stock: eq 15