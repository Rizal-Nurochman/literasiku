info:
  name: Get All Categories
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/categories"
  query:
    - name: page
      value: "1"
      disabled: false
    - name: limit
      value: "10"
      disabled: false
    - name: search
      value: ""
      disabled: true
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlIjoiQURNSU4iLCJpc3MiOiJsaXRlcmFzaWt1IiwiaWF0IjoxNzgyMDM4OTQwfQ.KbCj6mAk1dzKXaLB1odEnPhHbUxm-M9Ybr0ybec7rNI

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Categories retrieved successfully"
  - res.body.data.data: isArray
  - res.body.data.page: isNumber
  - res.body.data.total: isNumber