info:
  name: Get Category By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/categories/{{category_id}}"
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlIjoiQURNSU4iLCJpc3MiOiJsaXRlcmFzaWt1IiwiaWF0IjoxNzgyMDM4OTQwfQ.KbCj6mAk1dzKXaLB1odEnPhHbUxm-M9Ybr0ybec7rNI
    - name: category_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Category retrieved successfully"
  - res.body.data.id: eq {{category_id}}
  - res.body.data.name: isString