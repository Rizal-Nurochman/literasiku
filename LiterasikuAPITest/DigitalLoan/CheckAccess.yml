info:
  name: Check Access
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/loans/digital/access/{{book_id}}"
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""
    - name: book_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Access checked successfully"
  - res.body.data.has_access: isBoolean
