info:
  name: Get Digital Loan By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/loans/digital/{{digital_loan_id}}"
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""
    - name: digital_loan_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Loan retrieved successfully"
  - res.body.data.id: eq {{digital_loan_id}}
  - res.body.data.access_status: isString
