info:
  name: Get File By ID
  type: http
  seq: 22

http:
  method: GET
  url: "{{base_url}}/files/{{file_id}}"
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: file_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "File retrieved successfully"
  - res.body.data.id: eq {{file_id}}
  - res.body.data.file_name: isString
  - res.body.data.file_path: isString
  - res.body.data.upload_date: isString