info:
  name: Update File
  type: http
  seq: 23

http:
  method: PATCH
  url: "{{base_url}}/files/{{file_id}}"
  body:
    type: json
    data: |-
      {
        "file_name": "Laskar Pelangi (Revisi).pdf",
        "file_size": 6291456,
        "status": "ACTIVE"
      }
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlIjoiQURNSU4iLCJpc3MiOiJsaXRlcmFzaWt1IiwiaWF0IjoxNzgyMDM4OTQwfQ.KbCj6mAk1dzKXaLB1odEnPhHbUxm-M9Ybr0ybec7rNI
    - name: file_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "File updated successfully"
  - res.body.data.id: eq {{file_id}}
  - res.body.data.file_name: eq "Laskar Pelangi (Revisi).pdf"
  - res.body.data.file_size: eq 6291456