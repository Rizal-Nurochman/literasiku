info:
  name: Return Book
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/loans/physical/{{loan_id}}/return"
  body:
    type: json
    data: |-
      {
        "return_date": "2026-06-28"
      }
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""
    - name: loan_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Book returned successfully"
  - res.body.data.status: eq "RETURNED"
  - res.body.data.return_date: isString
