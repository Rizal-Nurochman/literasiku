info:
  name: Delete User
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/users/{{user_id}}"
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""
    - name: user_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "User deleted successfully"
