info:
  name: Get All Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/users"
  query:
    - name: page
      value: "1"
      disabled: false
    - name: limit
      value: "10"
      disabled: false
    - name: search
      value: ""
      disabled: true
    - name: role
      value: ""
      disabled: true
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Users retrieved successfully"
  - res.body.data.data: isArray
  - res.body.data.page: isNumber
  - res.body.data.total: isNumber
