info:
  name: Get My Profile
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/users/me"
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Profile retrieved successfully"
  - res.body.data.id: isNumber
  - res.body.data.email: isString
  - res.body.data.role: isString
