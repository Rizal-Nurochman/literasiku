info:
  name: Get User By ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/users/{{user_id}}"
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""
    - name: user_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "User retrieved successfully"
  - res.body.data.id: eq {{user_id}}
  - res.body.data.email: isString
  - res.body.data.role: isString
