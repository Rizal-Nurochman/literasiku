info:
  name: Update My Profile
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/users/me"
  body:
    type: json
    data: |-
      {
        "full_name": "Nama Saya",
        "phone_number": "089876543210",
        "address": "Jl. Rumah Saya No. 2"
      }
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "Profile updated successfully"
  - res.body.data.id: isNumber
  - res.body.data.full_name: eq "Nama Saya"
