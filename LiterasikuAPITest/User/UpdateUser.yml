info:
  name: Update User
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/users/{{user_id}}"
  body:
    type: json
    data: |-
      {
        "full_name": "Nama Baru",
        "phone_number": "081234567890",
        "address": "Jl. Contoh No. 1"
      }
  auth:
    type: bearer
    token: "{{login_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: login_token
      value: ""
    - name: user_id
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - res.status: eq 200
  - res.body.status: eq true
  - res.body.message: contains "User updated successfully"
  - res.body.data.id: eq {{user_id}}
  - res.body.data.full_name: eq "Nama Baru"
